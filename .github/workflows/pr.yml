name: PR

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]
    # No `branches:` filter. GitHub matches it against the pull request's BASE branch, so
    # scoping it to `main` gave a PR onto any other base NO checks at all -- not a red one,
    # none, which reads as green. Internal `main`'s own ci.yml already drops the filter; this
    # follows that precedent. Cost: every PR onto every branch now runs this workflow.

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Linting commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm i -g conventional-changelog-conventionalcommits
          npm i -g commitlint@latest
          echo "$PR_TITLE" | npx commitlint

