name: CI

on:
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.asf.yaml'
      - '.licenserc.yaml'
      - '.commitlintrc.yaml'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    # No `branches:` filter. GitHub matches it against the pull request's BASE branch, so
    # scoping it to `main` gave a PR onto any other base NO checks at all -- not a red one,
    # none, which reads as green. Internal `main`'s own ci.yml already drops the filter; this
    # follows that precedent. Cost: every PR onto every branch now runs this workflow.
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.asf.yaml'
      - '.licenserc.yaml'
      - '.commitlintrc.yaml'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    container:
      image: xd009642/tarpaulin:0.32.7
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        # librocksdb-sys generates its bindings with bindgen at build time, which
        # needs libclang. The hosted runners ship it; this container does not.
        #
        # cmake is an INTERNAL-FORK addition to this list. `cpp/` depends on
        # `substrait`, which exists on internal `main` and not on `oss/main`, and
        # whose `protobuf-src` build-dependency compiles protobuf FROM SOURCE with
        # cmake -- `protobuf-compiler` above installs the binary and does not
        # satisfy it. Upstream's copy of this job never builds substrait, so it
        # never needed cmake; measured here as
        # `failed to execute command: No such file or directory ... is `cmake` not
        # installed?` from protobuf-src's build script (run 34633465410).
        run: |
          apt-get update
          apt-get install -y protobuf-compiler clang libclang-dev cmake
      - name: Cache dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only cache cargo registry and git, not target directory
          # Tarpaulin needs clean builds for accurate coverage
          cache-targets: false
          # Reduce cache size by cleaning old artifacts
          cache-all-crates: false
      # Printed before and after, so a disk failure in this container job names what was
      # actually available instead of leaving it to be guessed at. The container cannot free
      # the host's preinstalled toolchains the way the python-tests job does -- it has its own
      # filesystem -- so the headroom here comes from what the build does NOT compile
      # (see COV_EXCLUDE in the Makefile), not from what is deleted.
      # This job runs in a container, so it cannot delete the host's preinstalled toolchains the
      # way the python-tests job does -- the container has its own filesystem and the host's
      # ~62 GB of 72 GB is already spent before any step runs. The headroom therefore has to come
      # from what the build does NOT produce: no debug info for dependencies
      # (`[profile.dev.package."*"]` in Cargo.toml, worth tens of GB here) and no incremental
      # artifacts, which CI never reuses. The df lines are printed either way so a future failure
      # names what was actually available rather than leaving it to be guessed at.
      - name: Disk and workspace size before
        run: df -h; du -sh target 2>/dev/null || true

      # COVERAGE INSTRUMENTATION IS UPSTREAM ONLY, and this is a disk decision, not a taste one.
      # This job runs in a container, so it cannot free the host's preinstalled toolchains the way
      # python-tests does -- it starts with 11 GB free of 72 GB, measured by the df above. A
      # `--engine llvm` tarpaulin run over this workspace does not fit: it filled the disk at 578
      # crates before `--exclude hudi-cpp` and at 585 after, and again after dependency debug info
      # was turned off, because tarpaulin needs debug info for source mapping and asks for it
      # regardless of the profile. The measurements are in the milestone's evidence folder.
      #
      # The coverage REPORT already had no consumer here: `publish-coverage` is upstream-only
      # because CODECOV_TOKEN exists on neither this repository nor its organisation. So on a fork
      # this job was spending 25 minutes and more disk than it has to produce an artifact nothing
      # reads. The TESTS are the part with value on a fork, and they still run -- the same
      # packages, the same features, just without the instrumentation.
      #
      # The cost, stated rather than hidden: a break in `make coverage-xml` itself is no longer
      # caught here, only upstream.
      - name: Rust unit tests with coverage report (upstream)
        if: github.repository == 'apache/hudi-rs'
        env:
          CARGO_INCREMENTAL: 0
        run: make coverage-xml
      - name: Rust unit tests, without coverage instrumentation (non-upstream)
        if: github.repository != 'apache/hudi-rs'
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --workspace --exclude hudi-cpp --all-features --no-fail-fast

      - name: Disk and workspace size after
        if: always()
        run: df -h; du -sh target/debug/deps target/debug/build 2>/dev/null || true
      - name: Upload coverage report
        if: github.repository == 'apache/hudi-rs'
        uses: actions/upload-artifact@v7
        with:
          name: cov-report-rust-tests-${{ runner.os }}
          path: ./cov-reports
          if-no-files-found: 'error'

  # hudi-core without `spill-rocksdb` must keep building and passing. That build
  # is the reason the feature exists — it needs no libclang and no C++ toolchain,
  # so a consumer that cannot take a native build (or does not want one in a
  # Python wheel) has a configuration to use. Nothing else in CI compiles it, so
  # without this job it would break silently.
  rust-tests-no-spill-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: no-spill-backend
      # Deliberately no clang/libclang: if a change makes the default-off build
      # pull rocksdb back in, this job fails to compile rather than quietly
      # reintroducing the native dependency.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Clippy without the spill backend
        run: cargo clippy -p hudi-core --lib --no-default-features -- -D warnings
      - name: Unit tests without the spill backend
        run: cargo test -p hudi-core --lib --no-default-features --no-fail-fast
      # The umbrella crate is where a consumer actually opts out, and it reaches
      # hudi-core twice: directly, and through hudi-datafusion. Either edge taking
      # default features hands the tier back without the steps above noticing,
      # since they only build hudi-core. Both shapes are built here, where there
      # is no libclang to build rocksdb with.
      - name: Check the umbrella crate without the spill backend
        run: cargo check -p hudi --no-default-features
      - name: Check the umbrella crate without the spill backend, with datafusion
        run: cargo check -p hudi --no-default-features --features datafusion
      # The steps above prove the opt-out COMPILES. This proves it actually drops
      # the dependency, and unlike them it does not rest on libclang being absent,
      # so it keeps working if this job ever gains a C++ toolchain.
      - name: Assert the opt-out drops rocksdb from the dependency graph
        run: |
          # A graph assertion has two ways to look like it passed: the tier
          # really is gone, or cargo tree never ran. `-i` exits non-zero with an
          # empty stdout in BOTH cases, so neither the output nor the status
          # alone tells them apart, and discarding stderr makes a broken command
          # indistinguishable from a working opt-out. Each check below therefore
          # pins the specific reason rather than inferring from emptiness.

          # Under defaults the tier must be reachable. If this ever stops
          # holding, the absence checks below are asserting nothing.
          for args in "" "--features datafusion"; do
            if ! out=$(cargo tree -p hudi $args -i rocksdb 2>&1) \
               || ! printf '%s\n' "$out" | grep -q '^rocksdb'; then
              echo "cargo tree did not find rocksdb under default features: '$args'"
              echo "so the absence checks below cannot tell an opt-out from a broken command"
              printf '%s\n' "$out"
              exit 1
            fi
          done

          # With the opt-out it must be gone — and gone because the package is
          # absent from the graph, which cargo says in those words, not because
          # the command failed for some other reason.
          for args in "--no-default-features" "--no-default-features --features datafusion"; do
            if out=$(cargo tree -p hudi $args -i rocksdb 2>&1); then
              echo "rocksdb is still reachable from hudi with: $args"
              printf '%s\n' "$out"
              exit 1
            elif ! printf '%s\n' "$out" | grep -q 'did not match any packages'; then
              echo "cargo tree failed for a reason other than rocksdb being absent: '$args'"
              printf '%s\n' "$out"
              exit 1
            fi
          done

  # Every other job builds with the rust-toolchain.toml dev pin; this job
  # compiles with the MSRV that Cargo.toml declares (read at run time so it
  # follows bumps), keeping the declared floor buildable once the two diverge.
  msrv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev
      - name: Install the MSRV toolchain
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$msrv" ]; then
            echo "could not read rust-version from Cargo.toml"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Cache dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - name: Check the workspace on the MSRV
        run: cargo +"$MSRV" check --workspace --all-targets --all-features

  # PORTED FROM INTERNAL `main`'s ci.yml (`cpp-ffi`). This was the one CI dimension internal
  # `main` covered and this branch did not: nothing else here compiles `hudi-cpp` at all, so the
  # cxx FFI bridge could break and every gate would still be green.
  #
  # It earns its place twice over on THIS lineage. `cpp/` is the only consumer of
  # `OBJECT_STORE_RUNTIME` (crates/core/src/ffi_support), which is internal-only -- OSS deleted it
  # in #689 -- and therefore the thing a future rebase onto OSS is most likely to drop. This job
  # is what turns that into a compile error instead of a silent loss.
  #
  # Internal's version opens with `aws-actions/configure-aws-credentials@v4`, which is NOT ported.
  # That step exists solely so `.cargo/config.toml`'s `token-from-stdout` credential provider can
  # mint a token for any private registry a fork's manifests pin through
  # `[patch.crates-io]`. This branch has neither the patch section nor the registry -- it takes
  # `arrow = "58"` from crates.io -- so the step would authenticate against nothing. Dropping it is
  # the arrow-rs posture applied, not a shortcut around it.
  cpp-ffi:
    name: C++ FFI build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cpp-ffi

      # This is the heaviest single build in the workflow: hudi-cpp pulls substrait, whose
      # protobuf-src build-dependency compiles protobuf FROM SOURCE, on top of rocksdb and
      # datafusion. It exhausted the runner's disk hard enough to kill the runner process itself
      # ("System.IO.IOException: No space left on device" writing the runner's own diagnostic
      # log), which reports as a bare job failure with no step logs at all. Unlike rust-tests
      # this job is not containerised, so it CAN reclaim the host's preinstalled toolchains --
      # the same step python-tests uses. df is printed either way so the next failure here names
      # what was available.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      # protobuf-compiler: lance-encoding/lance-file build prost. clang/libclang: librocksdb-sys
      # generates its bindings with bindgen at build time. cmake/build-essential: the cxx bridge
      # needs a C++ toolchain -- ubuntu-latest ships one, installed defensively in case the image
      # trims it, exactly as internal's job does.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler clang libclang-dev
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get install -y -qq build-essential cmake
          fi

      - name: cargo build -p hudi-cpp
        run: cargo build -p hudi-cpp

      # NOTE: --lib --tests, no --doc. Carried over from internal's job: hudi-cpp's own lib is
      # named `hudi` and it also depends on the `hudi` umbrella crate, so `cargo test --doc` shows
      # rustdoc two `--extern hudi=...rlib` candidates and aborts with E0464. This branch renames
      # the dependency (`hudi-dep = { package = "hudi", ... }`), which may already avoid it, but
      # the crate has no runnable doctests so excluding the doc target costs no coverage either
      # way and keeps the two sides' invocation identical.
      - name: cargo test -p hudi-cpp
        run: cargo test --no-fail-fast -p hudi-cpp --lib --tests

      - name: Disk after
        if: always()
        run: df -h /

  rust-tests-windows:
    runs-on: windows-2025
    # disable until https://github.com/apache/hudi-rs/issues/445 is resolved
    if: false    
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests on Windows with no coverage report
        run: cargo test --no-fail-fast --all-targets --all-features --workspace

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        # TODO: add windows
        os: [ ubuntu-24.04, ubuntu-22.04-arm, macos-15 ]
        python-version: [ '3.10', '3.13' ]
        exclude:
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-22.04-arm
            python-version: '3.13'
          - os: macos-15
            python-version: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # INTERNAL-FORK addition. `make build` and `make develop` each run maturin
      # over a workspace this fork has grown (cpp/, jni/, jvm-ffi/ and their
      # dependency closures on top of upstream's), and the ubuntu leg hit
      # `No space left on device (os error 28)` with `Free space left: 4 MB`
      # while maturin copied the built library (run 34633465410). The paths
      # removed are preinstalled toolchains this workflow never uses; the `df`
      # is deliberate, so a future failure here shows what was actually
      # available rather than leaving it to be guessed.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Cache Rust dependencies and build artifacts
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache based on Python version and OS for better hit rate
          shared-key: "python-binding-${{ matrix.os }}-py${{ matrix.python-version }}"
          # Save cache even on failure to speed up retries
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.7.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "python/pyproject.toml"

      - name: Setup Python venv and build
        run: |
          make setup-venv
          source .venv/bin/activate
          make build
          make develop
          
      - name: Python unit tests
        # Only compute coverage for one matrix combination to save time
        if: ${{ !((matrix.os == 'ubuntu-24.04') && (matrix.python-version == '3.13')) }}
        run: |
          source .venv/bin/activate
          pytest -v
          
      - name: Python unit tests with coverage report
        # Only compute coverage for ubuntu-24.04 with Python 3.13
        if: ${{ (matrix.os == 'ubuntu-24.04') && (matrix.python-version == '3.13') }}
        run: |
          source .venv/bin/activate
          coverage run --include 'python/hudi/*' -m pytest -v
          coverage xml --data-file=.coverage -o ./cov-reports/cov-report-python-tests-${{ join(matrix.*, '-') }}.xml
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: ${{ (matrix.os == 'ubuntu-24.04') && (matrix.python-version == '3.13') }}
        with:
          name: cov-report-python-tests-${{ join(matrix.*, '-') }}
          path: ./cov-reports
          if-no-files-found: 'error'
          
      - name: Upload wheel files
        uses: actions/upload-artifact@v7
        with:
          name: python-artifact-${{ join(matrix.*, '-') }}
          path: ./target/wheels/*.whl
          if-no-files-found: 'error'

  integration-tests:
    strategy:
        fail-fast: false
        matrix:
          # hudi-file-group-api/cpp is disabled from this position up. This position replaces the C++
          # file-group reader API the demo app is written against (new_file_group_reader_with_options
          # and read_file_slice_from_paths become new_file_group_reader_with_context over an
          # FfiReaderContext, with a caller-frees stream contract), so the app no longer compiles here.
          # Re-enable it once demo/apps/hudi-file-group-api/cpp/main.cpp is ported to the new API.
          app-path: [ 'datafusion', 'hudi-table-api/rust' , 'hudi-table-api/python' ]
    runs-on: ubuntu-latest
    # `compose up` now waits for mc to finish seeding, so a wedged seed blocks rather than letting
    # the app fail fast. The slowest leg takes ~26 minutes warm and ~45 cold.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # INTERNAL-FORK addition. Once ci_run.sh stopped swallowing the app's exit status, the apps
      # really built, and a debug build of hudi (datafusion, lance, rocksdb) inside the runner
      # container, plus the demo app's own target dir, ran the host out of disk: `No space left on
      # device` compiling hudi-python, and on the datafusion leg a runner killed with no step logs
      # (run 35031780895). A superset of the cpp-ffi and python-tests reclaim - those two do not
      # build inside a container on top of a restored target dir - and the npm shims go with
      # node_modules, so a later step gets "not installed" rather than a dangling symlink. df is
      # printed before and after so the next failure here names what was available.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/lib/node_modules \
                      /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Pre-pull base images
        run: |
          docker pull quay.io/minio/minio:latest
      - name: Prepare cache directories with correct permissions
        run: |
          mkdir -p .cargo/registry .cargo/git target python/target .uv-cache
          sudo chown -R $(id -u):$(id -g) .cargo target python/target .uv-cache
      - name: Cache integration build artifacts (cargo/target/uv)
        uses: actions/cache@v6
        with:
          path: |
            target
            .cargo/registry
            .cargo/git
            python/target
            .uv-cache
          # Keyed by what the leg actually builds, not by the leg: the three `make setup develop`
          # legs produce target dirs that measured 1162 MB each and are interchangeable in
          # practice (the shared CARGO_HOME registry may differ by a few app-specific crates,
          # so a leg that loses the save race re-downloads those, rather than rebuilding), while the cpp
          # leg builds --release and produces a different one (661 MB). One key for all four made
          # three of them lose the race to save it ("Unable to reserve cache with key ...,
          # another job may be creating this cache"); one key EACH quadrupled what this job holds
          # to 4.1 GB of the repo's 10 GB cache quota, which evicts other jobs' caches. Two
          # content groups keep the useful cache and the footprint at ~1.8 GB.
          # Note: the '**/Cargo.lock' term matches nothing - the root lockfile is gitignored - so
          # the hash really varies with python/Cargo.toml and the runner Dockerfile, and a plain
          # dependency bump does not rotate the key. Deliberate: cargo recompiles what changed
          # anyway, and a key that rotated often would write a new ~1.2 GB entry each time.
          key: integration-${{ runner.os }}-${{ matrix.app-path == 'hudi-file-group-api/cpp' && 'cpp' || 'rust-python' }}-${{ hashFiles('**/Cargo.lock', 'python/Cargo.toml', 'demo/infra/runner/Dockerfile') }}
          # Group-scoped restore only. A bare `integration-${{ runner.os }}-` fallback looks like a
          # free warm start, but it lets one group restore the other's target dir and then save it
          # back merged - measured: the cpp cache went from 661 MB to 1639 MB that way.
          restore-keys: |
            integration-${{ runner.os }}-${{ matrix.app-path == 'hudi-file-group-api/cpp' && 'cpp' || 'rust-python' }}-
      - name: Integration test - ${{ matrix.app-path }}
        run: |
          cd demo
          ./ci_run.sh ${{ matrix.app-path }}
      - name: Disk after
        if: always()
        run: df -h /
      - name: Fix cache ownership before save
        if: always()
        run: |
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/.cargo $GITHUB_WORKSPACE/target $GITHUB_WORKSPACE/python/target $GITHUB_WORKSPACE/.uv-cache || true

  manylinux-wheel-build:
    name: Build the manylinux wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Builds the wheel in the same container, running the same dependency
      # script, that the release workflow publishes from. Regular CI runs on the
      # host, whose apt protoc is new enough for lance-encoding's prost-build and
      # which carries libclang for librocksdb-sys, so a container-only break (see
      # #750) stays invisible until a release tag is pushed - by which point the
      # version is burnt on crates.io and cannot be reused.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m python/Cargo.toml --out dist
          # Pin the image rather than relying on the default, so this job and the
          # release steps are provably the same environment.
          manylinux: '2014'
          before-script-linux: |
            source .github/scripts/manylinux-build-deps.sh
      # A wheel that compiles is not necessarily a wheel that loads: the
      # bindings rocksdb generates come from the container's older libclang, and
      # bad bindings tend to surface on import or first use rather than at
      # compile time. Each runner installs the wheel it just built.
      - name: Import the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import hudi; print(hudi.__file__)"

  # UPSTREAM ONLY -- and rust-tests only produces the coverage artifact upstream too, for the
  # disk reason recorded on that job. codecov.io is apache/hudi-rs's account: `CODECOV_TOKEN` exists nowhere on
  # this fork or its organisation, and the upload below is `fail_ci_if_error: true`, so on a
  # fork this job is a guaranteed red that reports nothing about the code. The coverage
  # artifacts are still produced and uploaded by rust-tests and python-tests either way --
  # only the push to a third-party service upstream owns is conditional.
  publish-coverage:
    name: Publish coverage reports to codecov.io
    runs-on: ubuntu-latest
    needs: [ rust-tests, python-tests ]
    if: github.repository == 'apache/hudi-rs' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cov-report-*
          merge-multiple: true
          path: ./cov-reports
      - name: Upload coverage reports to codecov.io
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./cov-reports
