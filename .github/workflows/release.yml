name: Publish artifacts

# Two paths, deliberately, because both are used:
#   * the NORMAL path -- push a `release-<version>` tag at the commit to release;
#   * the AD-HOC path -- `workflow_dispatch`, carried over from the internal fork's own
#     release.yml, for a release cut by hand from a chosen ref.
# The ad-hoc path takes the version as an input rather than inferring it, because a dispatch
# has no tag to read it from: `validate-release-tag` compares GITHUB_REF_NAME against the
# workspace version, and on a dispatch that name is the BRANCH, so an input-less dispatch can
# only ever fail its first job.
on:
  push:
    tags:
      - 'release-[0-9]+.[0-9]+.[0-9]+**'
  workflow_dispatch:
    inputs:
      version:
        description: "the workspace version this ad-hoc release carries; must equal [workspace.package] version in Cargo.toml, which .github/scripts/workspace-version.sh prints"
        required: true

jobs:
  validate-release-tag:
    name: Validate git tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compare the release coordinate with the workspace version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The ONE authoritative version (.github/scripts/workspace-version.sh reads
          # [workspace.package] version from the root Cargo.toml and nothing else).
          CURR_VER=$(.github/scripts/workspace-version.sh)
          case "${GITHUB_EVENT_NAME}" in
            push)              CLAIMED="${GITHUB_REF_NAME#release-}"; SOURCE="tag ${GITHUB_REF_NAME}" ;;
            workflow_dispatch) CLAIMED="${INPUT_VERSION}";            SOURCE="workflow_dispatch input" ;;
            *) echo "unexpected event ${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac
          if [[ "${CLAIMED}" != "${CURR_VER}" ]]; then
            echo "The ${SOURCE} claims version '${CLAIMED}', but [workspace.package] version is '${CURR_VER}'."
            exit 1
          fi
          echo "release coordinate ${CLAIMED} matches the workspace version (from ${SOURCE})"

  # Build every artifact before anything is uploaded. crates.io refuses a second
  # publish of the same version, so a build that fails after a sibling job has
  # already uploaded strands the release on a version that cannot be reused.
  build-mac:
    name: Build wheels on Mac
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # RocksDB uses C++17 aligned allocation, available on macOS 10.13+,
          # while the x86_64 build otherwise runs at rustc's 10.12 floor and
          # fails to compile. arm64 already floors at 11.0.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.13' || '11.0' }}
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-mac-${{ matrix.target }}
          path: dist

  build-windows:
    name: Build wheels on Windows
    needs: validate-release-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: choco install protoc --yes

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          command: build
          args: --release -m python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist

  build-manylinux:
    name: Build wheels and sdist on manylinux
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m python/Cargo.toml --out dist

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m python/Cargo.toml --out dist
          manylinux: '2014'
          before-script-linux: |
            source .github/scripts/manylinux-build-deps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [ build-mac, build-windows, build-manylinux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # UPSTREAM ONLY. Everything above this line runs everywhere; only the upload is
      # conditional. `github.repository` cannot be spoofed by a fork, needs no secret and no
      # repository setting, so a fork CANNOT reach PyPI even if someone hands it a token.
      - name: Upload to pypi
        if: github.repository == 'apache/hudi-rs'
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          MATURIN_REPOSITORY: pypi
        with:
          command: upload
          # --non-interactive so a missing token fails here rather than blocking
          # on a credential prompt until the job times out.
          args: --skip-existing --non-interactive dist/*

      # The fork's twin: validates exactly the artifacts the upload would have taken, and
      # contacts nothing. Keeping the job (rather than skipping it) means the `needs:` graph
      # and the artifact download are exercised on this fork too.
      - name: Validate the wheels instead of uploading them (non-upstream)
        if: github.repository != 'apache/hudi-rs'
        run: |
          set -euo pipefail
          echo "repository is '${{ github.repository }}', not apache/hudi-rs -- NOT uploading to PyPI."
          python3 -m pip install --quiet --upgrade pip twine
          ls -l dist
          python3 -m twine check dist/*

  publish-crates:
    name: Publish to crates.io
    needs: [ build-mac, build-windows, build-manylinux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # One invocation rather than a crate at a time: cargo packages and
      # verifies all three before uploading any, and works out the order itself,
      # so a failure part-way cannot leave one crate published at a version the
      # workflow can never re-run.
      # UPSTREAM ONLY -- see the note on publish-pypi above.
      - name: cargo publish
        if: github.repository == 'apache/hudi-rs'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p hudi-core -p hudi-datafusion -p hudi --all-features

      # The fork's twin. `--dry-run` packages and VERIFIES all three crates -- the same work
      # the real publish does -- and stops before the upload, so this is a real gate rather
      # than a placeholder.
      - name: cargo publish --dry-run instead of publishing (non-upstream)
        if: github.repository != 'apache/hudi-rs'
        run: |
          set -euo pipefail
          echo "repository is '${{ github.repository }}', not apache/hudi-rs -- NOT publishing to crates.io."
          cargo publish --dry-run -p hudi-core -p hudi-datafusion -p hudi --all-features
