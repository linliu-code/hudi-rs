name: Code

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    # No `branches:` filter. GitHub matches it against the pull request's BASE branch, so
    # scoping it to `main` gave a PR onto any other base NO checks at all -- not a red one,
    # none, which reads as green. Internal `main`'s own ci.yml already drops the filter; this
    # follows that precedent. Cost: every PR onto every branch now runs this workflow.

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check license header
        uses: apache/skywalking-eyes/header@v0.9.0

      # The carrier's Makefile rules build nothing here: stand-in libraries are compiled by the test
      # itself, so this needs only gcc, binutils, cargo (for `cargo tree`) and a JDK's `jar`.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Test the JNI carrier Makefile rules
        run: make test-jni-carrier

      # Needs neither cargo nor a venv, so it runs before the expensive setup below and a
      # version that has drifted out of its single source fails in seconds.
      - name: Check the version is single-sourced
        run: make check-version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.7.19"

      - name: Check rust code style
        run: make check-rust

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install python linter dependencies
        run: |
          make setup-venv
          source .venv/bin/activate
          uv pip install -r python/pyproject.toml --extra lint

      - name: Check python code style
        run: |
          source .venv/bin/activate
          make check-python
