# An action ref that is not on the ASF allowlist does not fail loudly — the run
# ends in "Startup failure" with no logs and no notification, and the pull
# request looks green because no check ever reported. This job is the only thing
# that makes such a ref visible. See
# https://github.com/apache/infrastructure-actions/issues/574
name: ASF Allowlist Check

on:
  workflow_dispatch:
  pull_request:
    # No `branches:` filter. GitHub matches it against the pull request's BASE branch, so
    # scoping it to `main` gave a PR onto any other base NO checks at all -- not a red one,
    # none, which reads as green. Internal `main`'s own ci.yml already drops the filter; this
    # follows that precedent. Cost: every PR onto every branch now runs this workflow.
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  # UPSTREAM ONLY. The allowlist this action checks against is ASF infrastructure policy and is
  # enforced only on ASF-hosted repositories; on this fork the action reports, but nothing acts
  # on the report. It is also red here BY CONSTRUCTION and permanently so: the internal-only
  # jni-native.yml uses `aws-actions/configure-aws-credentials@v4` to assume the org's publisher
  # role, an action the ASF will not allowlist and which that workflow cannot do without.
  #
  # The file is kept, unmodified apart from this condition, rather than deleted: its value is
  # for code on its way UPSTREAM, where the failure mode it guards ("Startup failure", no logs,
  # no check reported, PR looks green) is real. Deleting it would have made an inconvenient red
  # disappear and silently dropped a capability; this states the reason in the file instead.
  asf-allowlist-check:
    if: github.repository == 'apache/hudi-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: apache/infrastructure-actions/allowlist-check@main
